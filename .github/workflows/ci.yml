# Checks every push and pull request: the same commands as `npm run check`,
# `npm run test:python` and `npm run test:parity` locally. Deploys still go
# through Vercel's Git integration; branch protection on main requires these.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Lint, test and build (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Some pages (the leaderboard) read the database while prerendering: a fresh local.db from the migrations.
      - run: npm run db:migrate
      - run: npm run build
        env:
          # Prerender with the mock market: no keys, deterministic data.
          MARKET_DATA_SOURCE: mock
          # A throwaway value: Better Auth refuses to build with its default secret.
          BETTER_AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
          BETTER_AUTH_URL: http://localhost:3000

  python:
    name: Test (Python analytics)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/analytics
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # 3.12 is what Vercel runs the service on.
      - run: uv python install 3.12
      - run: uv sync --extra dev --locked --python 3.12
      - run: uv run --extra dev pytest -q

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Production dependencies only; high and critical advisories fail the check.
      - run: npm audit --omit=dev --audit-level=high
      - uses: astral-sh/setup-uv@v7
      - name: pip-audit (Python, locked versions)
        working-directory: services/analytics
        run: |
          uv export --locked --no-dev --no-hashes --format requirements-txt > /tmp/requirements.txt
          uvx --from pip-audit==2.9.0 pip-audit --strict -r /tmp/requirements.txt

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev --locked --python 3.12
        working-directory: services/analytics
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run build
        env:
          MARKET_DATA_SOURCE: mock
          BETTER_AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
          BETTER_AUTH_URL: http://localhost:3010
      # Starts both services itself (scripts/e2e-serve.mjs), on a fresh e2e.db.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
