[project]
name = "marketlab-analytics"
version = "1.0.0"
description = "MarketLab's Python analytics service: backtests, portfolio and factor analytics, options, machine learning and the nightly jobs."
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.143.3",
  "pydantic==2.14.1",
  "pandas==3.0.6",
  "numpy==2.5.4",
  "httpx==0.28.1",
  "scipy==1.18.1",
  "statsmodels==0.15.0",
  "scikit-learn==1.9.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "uvicorn==0.54.0",
]

[tool.uv]
package = false
# Resolve only releases published by this date, so re-locking is reproducible.
exclude-newer = "2026-10-21T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Starlette suggests a successor to httpx for its test client; httpx is what this pinned set uses.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
